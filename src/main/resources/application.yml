spring:
  application:
    name: polizas-api
  datasource:
    # Perfil por defecto: H2 en memoria en modo PostgreSQL (arranque sin dependencias externas).
    url: jdbc:h2:mem:polizas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
  http:
    clients:
      # Timeouts del cliente HTTP hacia el CORE: fallar rápido en lugar de bloquear hilos.
      connect-timeout: 2s
      read-timeout: 3s

polizas:
  renovacion:
    # IPC anual (%) aplicado al canon en cada renovación. Valor de referencia configurable por entorno.
    ipc-porcentaje: ${IPC_PORCENTAJE:5.20}
  seguridad:
    api-key-header: api-key
    api-key: ${API_KEY:123456}
  core:
    # Servicio agnóstico de edición del CORE. Por defecto, el mock expuesto por esta misma aplicación.
    url: ${CORE_URL:http://localhost:${server.port}/core-mock}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Incluye el correlation id en cada línea de log.
    correlation: "[%X{correlationId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
