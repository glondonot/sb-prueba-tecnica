services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polizas
      POSTGRES_USER: polizas
      POSTGRES_PASSWORD: polizas
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polizas -d polizas"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/polizas
      DB_USERNAME: polizas
      DB_PASSWORD: polizas
    ports:
      - "8080:8080"
